spring:
  application:
    name: app
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quimia}
    username: ${SPRING_DATASOURCE_USERNAME:quimia}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # Usado só com APP_EMAIL_SENDER_MODE=smtp. Gmail: senha de app (conta com verificação em 2 etapas).
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jackson:
    deserialization:
      # 1.9 em um campo inteiro (ex.: produtoIds) é recusado em vez de truncado para 1.
      accept-float-as-int: false
  servlet:
    multipart:
      # O maior arquivo é o PDF da FDS (10 MB, o limite de arquivo raw do Cloudinary); a imagem (5 MB) é conferida
      # pelo caso de uso. O pedido leva os dois.
      max-file-size: 10MB
      max-request-size: 16MB
server:
  port: ${SERVER_PORT:8080}

quimia:
  jwt:
    private-key-base64: ${QUIMIA_JWT_PRIVATE_KEY_BASE64:}
    public-key-base64: ${QUIMIA_JWT_PUBLIC_KEY_BASE64:}
    private-key-path: ${QUIMIA_JWT_PRIVATE_KEY_PATH:.secrets/jwt-private.pkcs8.pem}
    public-key-path: ${QUIMIA_JWT_PUBLIC_KEY_PATH:.secrets/jwt-public.pem}
    kid: ${QUIMIA_JWT_KID:local-dev-01}
    issuer: ${QUIMIA_JWT_ISSUER:quimia-auth}
    audience: ${QUIMIA_JWT_AUDIENCE:quimia-api}
    access-ttl-minutes: ${QUIMIA_JWT_ACCESS_TTL_MINUTES:15}
  # Imagens dos produtos e logos das empresas. Sem as três variáveis o cadastro funciona, mas enviar imagem responde 503.
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  # Leitura do PDF da FDS pelo quimia-extractor-ai (POST {url}/extracoes). Sem URL, enviar `fds` responde 503.
  extrator:
    url: ${QUIMIA_EXTRATOR_URL:}
    token: ${QUIMIA_EXTRATOR_TOKEN:}
    timeout-segundos: ${QUIMIA_EXTRATOR_TIMEOUT_SEGUNDOS:60}
  fds:
    # Com true, produto novo só é criado com o PDF da FDS. Fica false até o extrator estar no ar.
    obrigatoria: ${QUIMIA_FDS_OBRIGATORIA:false}
  # Kemi (app) e WebKemi (portal): quimia-agent. Sem URL o chat responde 503 agente_indisponivel.
  agente:
    url: ${QUIMIA_AGENTE_URL:}
    token: ${QUIMIA_AGENTE_TOKEN:}
    timeout-segundos: ${QUIMIA_AGENTE_TIMEOUT_SEGUNDOS:120}
    # Escanear rótulo pela foto (POST /produtos/busca-por-imagem): quem escaneia espera diante da câmera.
    timeout-rotulo-segundos: ${QUIMIA_AGENTE_TIMEOUT_ROTULO_SEGUNDOS:30}
    mensagens-por-hora: ${QUIMIA_AGENTE_MENSAGENS_POR_HORA:20}

# Documentação OpenAPI das rotas: /v3/api-docs (JSON) e /swagger-ui.html. Ligada também em produção;
# SWAGGER_ENABLED=false desliga as duas.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    operations-sorter: alpha
    display-request-duration: true
  default-produces-media-type: application/json
  packages-to-scan: com.api.quimia.domain
  writer-with-order-by-keys: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  csrf:
    enabled: ${APP_CSRF_ENABLED:true}
  auth:
    cookie-name: ${APP_AUTH_COOKIE_NAME:quimia_rt}
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:true}
    cookie-samesite: ${APP_AUTH_COOKIE_SAMESITE:Lax}
    refresh-ttl-days: ${APP_AUTH_REFRESH_TTL_DAYS:30}
    refresh-inactivity-days: ${APP_AUTH_REFRESH_INACTIVITY_DAYS:7}
    max-failures: ${APP_AUTH_MAX_FAILURES:5}
    block-minutes: ${APP_AUTH_BLOCK_MINUTES:15}
    # Segredo HMAC (>= 32 bytes) para códigos de recuperação e vínculo de tokens à senha.
    # APP_AUTH_RECOVERY_CODE_PEPPER segue aceito como nome legado.
    hmac-secret: ${APP_AUTH_HMAC_SECRET:${APP_AUTH_RECOVERY_CODE_PEPPER:}}
    empresa-reset-url: ${APP_AUTH_EMPRESA_RESET_URL:http://localhost:3000/recuperar-senha}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:}
  email:
    # noop | smtp | resend
    sender-mode: ${APP_EMAIL_SENDER_MODE:noop}
    from: ${APP_EMAIL_FROM:}
    resend:
      api-key: ${RESEND_API_KEY:}
