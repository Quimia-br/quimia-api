name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-e-testes:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-v1
          restore-keys: nvd-${{ runner.os }}-

      - name: Compilar
        run: mvn compile --no-transfer-progress

      - name: Testes e cobertura
        run: mvn verify --no-transfer-progress

      - name: Verificar cobertura mínima
        run: |
          COBERTURA=$(mvn jacoco:report --no-transfer-progress -q && \
            grep -A1 'INSTRUCTION' target/site/jacoco/jacoco.csv | \
            tail -1 | awk -F',' '{printf "%.0f", ($5/($4+$5))*100}')
          echo "Cobertura: $COBERTURA%"
          if [ "$COBERTURA" -lt 80 ]; then
            echo "Cobertura abaixo do mínimo exigido (80%). Atual: $COBERTURA%"
            exit 1
          fi

      - name: Verificar vulnerabilidades
        run: mvn dependency-check:check --no-transfer-progress
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        continue-on-error: false
