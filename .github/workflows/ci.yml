name: Quimia API CI and Discloud Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Temurin Java 21 and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            pom.xml
            .mvn/wrapper/maven-wrapper.properties

      - name: Compile and package the executable Spring Boot JAR
        id: build
        run: |
          set -euo pipefail
          sh ./mvnw -B -ntp clean package -DskipTests
          mapfile -t jars < <(find target -maxdepth 1 -type f -name 'quimia-*.jar' ! -name '*.original' -print)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one executable JAR, found ${#jars[@]}." >&2
            exit 1
          fi
          jar --list --file "${jars[0]}" | grep -Fxq 'BOOT-INF/'

      - name: Share the executable JAR with the gated artifact job
        uses: actions/upload-artifact@v7
        with:
          name: quimia-api-jar
          path: target/quimia-*.jar
          if-no-files-found: error
          retention-days: 1

      - name: Explain the Build check
        if: always()
        env:
          CHECK_RESULT: ${{ job.status }}
        run: |
          {
            echo '### Build'
            echo
            echo "**Resultado:** ${CHECK_RESULT}"
            echo
            echo '**O que valida:** compilação e empacotamento do JAR executável do Spring Boot.'
            echo
            echo '**Critério de aprovação:** `mvnw clean package -DskipTests` termina sem erro, existe exatamente um JAR do projeto e ele contém `BOOT-INF/`.'
            if [ "${CHECK_RESULT}" = success ]; then
              echo
              echo 'O JAR foi produzido e disponibilizado ao job de artefato.'
            else
              echo
              echo 'Não passou. Abra o passo de build acima; os logs indicam a compilação, o empacotamento ou a validação do JAR que falhou.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Temurin Java 21 and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            pom.xml
            .mvn/wrapper/maven-wrapper.properties

      - name: Run unit and architecture tests
        id: tests
        run: sh ./mvnw -B -ntp clean test

      - name: Preserve Surefire reports for diagnosis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Explain the Unit tests check
        if: always()
        env:
          CHECK_RESULT: ${{ job.status }}
        run: |
          {
            echo '### Unit tests'
            echo
            echo "**Resultado:** ${CHECK_RESULT}"
            echo
            echo '**O que valida:** testes JUnit/Surefire, incluindo as regras de arquitetura ArchUnit.'
            echo
            echo '**Critério de aprovação:** a fase Maven `test` termina sem testes com falha ou erro.'
            if [ "${CHECK_RESULT}" = success ]; then
              echo
              echo 'Todos os testes executados passaram.'
            else
              echo
              echo 'Não passou. Consulte os logs do Maven e baixe o artefato `surefire-reports` para ver a classe e a asserção que falharam.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Temurin Java 21 and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            pom.xml
            .mvn/wrapper/maven-wrapper.properties

      - name: Run the complete Maven verify lifecycle
        id: coverage
        run: sh ./mvnw -B -ntp clean verify

      - name: Preserve JaCoCo report for diagnosis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Explain the Coverage gate
        if: always()
        env:
          CHECK_RESULT: ${{ job.status }}
        run: |
          {
            echo '### Coverage gate'
            echo
            echo "**Resultado:** ${CHECK_RESULT}"
            echo
            echo '**O que valida:** ciclo `verify` completo, testes de arquitetura e cobertura JaCoCo.'
            echo
            echo '**Critério de aprovação:** cobertura de instruções do bundle igual ou superior a 80%, conforme a regra JaCoCo do `pom.xml`.'
            if [ "${CHECK_RESULT}" = success ]; then
              echo
              echo 'O ciclo verify terminou e a cobertura mínima foi atingida.'
            else
              echo
              echo 'Não passou. Consulte o log do JaCoCo e, se gerado, baixe `jacoco-report` para identificar a cobertura medida e a regra violada.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  artifact:
    name: Discloud artifact
    needs: [build, unit-tests, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Temurin Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Download the validated executable JAR
        uses: actions/download-artifact@v8
        with:
          name: quimia-api-jar
          path: target

      - name: Test the Discloud deployment helper
        working-directory: scripts/discloud-deploy
        run: node --test deploy.test.mjs

      - name: Create and validate the Discloud ZIP
        id: package
        run: |
          set -euo pipefail
          mapfile -t jars < <(find target -maxdepth 1 -type f -name 'quimia-*.jar' ! -name '*.original' -print)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one executable JAR, found ${#jars[@]}." >&2
            exit 1
          fi
          sh scripts/package-discloud-release.sh "${jars[0]}" target/discloud/quimia-api.zip

      - name: Upload the release artifact
        uses: actions/upload-artifact@v7
        with:
          name: quimia-api-discloud
          path: target/discloud/quimia-api.zip
          if-no-files-found: error
          retention-days: 14

      - name: Explain the Discloud artifact check
        if: always()
        env:
          CHECK_RESULT: ${{ job.status }}
        run: |
          {
            echo '### Discloud artifact'
            echo
            echo "**Resultado:** ${CHECK_RESULT}"
            echo
            echo '**O que valida:** testes do helper de deploy e criação do pacote que será enviado à Discloud.'
            echo
            echo '**Critério de aprovação:** `quimia-api-discloud.zip` existe e contém somente `app.jar` e `discloud.config` na raiz.'
            if [ "${CHECK_RESULT}" = success ]; then
              echo
              echo 'O pacote foi validado e publicado como artefato do workflow.'
            else
              echo
              echo 'Não passou. Consulte os testes do helper, a listagem do JAR ou a validação do ZIP nos logs.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-discloud:
    name: Deploy to Discloud
    needs: [build, unit-tests, coverage, artifact]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: discloud
      url: https://quimia-api.discloud.app
    steps:
      - name: Checkout the released source
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/discloud-deploy/package-lock.json

      - name: Download the validated release ZIP
        uses: actions/download-artifact@v8
        with:
          name: quimia-api-discloud
          path: target/discloud

      - name: Install the locked Discloud SDK
        working-directory: scripts/discloud-deploy
        run: npm ci --no-audit --no-fund

      - name: Re-run deploy helper tests before using credentials
        working-directory: scripts/discloud-deploy
        run: node --test deploy.test.mjs

      - name: Upload the release to Discloud
        id: upload
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: ${{ secrets.DISCLOUD_APP_ID }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          DISCLOUD_ARCHIVE: target/discloud/quimia-api.zip
        run: node scripts/discloud-deploy/deploy.mjs

      - name: Wait for the protected API route
        id: smoke-check
        run: |
          set -euo pipefail
          endpoint='https://quimia-api.discloud.app/api/v1/usuarios/me'
          deadline=$((SECONDS + 180))
          last_status='000'

          while (( SECONDS < deadline )); do
            remaining=$((deadline - SECONDS))
            request_timeout=10
            if (( remaining < request_timeout )); then
              request_timeout=$remaining
            fi

            last_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --connect-timeout "$request_timeout" --max-time "$request_timeout" \
              "$endpoint" || true)"

            if [ "$last_status" = '401' ]; then
              echo 'Smoke check passed: /api/v1/usuarios/me correctly requires authentication.'
              exit 0
            fi

            case "$last_status" in
              000|5??) ;;
              *)
                echo "Smoke check expected HTTP 401 from the protected route, received HTTP $last_status." >&2
                exit 1
                ;;
            esac

            remaining=$((deadline - SECONDS))
            if (( remaining <= 0 )); then
              break
            fi
            sleep_for=5
            if (( remaining < sleep_for )); then
              sleep_for=$remaining
            fi
            sleep "$sleep_for"
          done

          echo "Smoke check timed out after 180 seconds; last HTTP status was $last_status." >&2
          exit 1

      - name: Explain the Discloud deploy check
        if: always()
        env:
          CHECK_RESULT: ${{ job.status }}
        run: |
          {
            echo '### Deploy to Discloud'
            echo
            echo "**Resultado:** ${CHECK_RESULT}"
            echo
            echo '**O que valida:** criação inicial ou atualização da aplicação Discloud e inicialização da API hospedada.'
            echo
            echo '**Critério de aprovação:** na primeira publicação, a conta não possui apps e o SDK cria a aplicação; nas próximas, `DISCLOUD_APP_ID` seleciona o app a atualizar. Em ambos os casos, `GET /api/v1/usuarios/me` deve retornar HTTP 401, confirmando que a rota está online e protegida.'
            if [ "${CHECK_RESULT}" = success ]; then
              echo
              echo 'Upload/criação e smoke check foram concluídos. Se este foi o primeiro deploy, configure `DISCLOUD_APP_ID` antes da próxima Release.'
            else
              echo
              echo 'Não passou. Verifique os logs do upload, o token, o ID do app (obrigatório quando a conta já possui apps), as variáveis de runtime da Discloud e a inicialização da aplicação.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  workflow-summary:
    name: CI summary
    needs: [build, unit-tests, coverage, artifact, deploy-discloud]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize every gate and enforce the workflow result
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_RESULT: ${{ needs.build.result }}
          TESTS_RESULT: ${{ needs.unit-tests.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          ARTIFACT_RESULT: ${{ needs.artifact.result }}
          DEPLOY_RESULT: ${{ needs.deploy-discloud.result }}
        run: |
          set -euo pipefail
          {
            echo '## Resultado geral do workflow'
            echo
            echo '| Check | Resultado | O que prova |'
            echo '|---|---|---|'
            printf '| Build | `%s` | JAR Spring Boot compilado e empacotado. |\n' "$BUILD_RESULT"
            printf '| Unit tests | `%s` | Testes JUnit/Surefire e regras ArchUnit. |\n' "$TESTS_RESULT"
            printf '| Coverage gate | `%s` | `mvn verify` e cobertura JaCoCo mínima de 80%%. |\n' "$COVERAGE_RESULT"
            printf '| Discloud artifact | `%s` | ZIP validado com `app.jar` e `discloud.config`. |\n' "$ARTIFACT_RESULT"
            if [ "$EVENT_NAME" = 'release' ]; then
              printf '| Deploy to Discloud | `%s` | Upload e smoke check HTTP 401. |\n' "$DEPLOY_RESULT"
            else
              printf '| Deploy to Discloud | `%s` | Ignorado: só executa em Release publicada. |\n' "$DEPLOY_RESULT"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$BUILD_RESULT" != success ] \
            || [ "$TESTS_RESULT" != success ] \
            || [ "$COVERAGE_RESULT" != success ] \
            || [ "$ARTIFACT_RESULT" != success ]; then
            echo 'At least one required CI gate did not succeed.' >&2
            exit 1
          fi

          if [ "$EVENT_NAME" = 'release' ] && [ "$DEPLOY_RESULT" != success ]; then
            echo 'The published release did not complete the Discloud deployment check.' >&2
            exit 1
          fi

          echo 'All checks required for this event succeeded.'
