name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-e-testes:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-v1
          restore-keys: nvd-${{ runner.os }}-

      - name: Compilar
        run: mvn compile --no-transfer-progress

      - name: Testes e cobertura
        run: mvn verify --no-transfer-progress

      - name: Verificar cobertura mínima
        run: |
          mvn jacoco:report --no-transfer-progress -q
          # Soma INSTRUCTION_MISSED ($4) e INSTRUCTION_COVERED ($5) de
          # todas as classes do CSV. Se nada for elegivel (scaffold sem
          # modulo real, todas excluidas), considera o gate cumprido
          # trivialmente — o jacoco:check do pom ja governa o threshold
          # real quando ha classes medidas.
          COBERTURA=$(awk -F',' '
            NR > 1 { missed += $4; covered += $5 }
            END {
              total = missed + covered
              if (total == 0) { print "100" }
              else { printf "%.0f\n", (covered / total) * 100 }
            }
          ' target/site/jacoco/jacoco.csv)
          echo "Cobertura: $COBERTURA%"
          if [ "$COBERTURA" -lt 80 ]; then
            echo "Cobertura abaixo do mínimo exigido (80%). Atual: $COBERTURA%"
            exit 1
          fi

      - name: Verificar vulnerabilidades
        run: mvn dependency-check:check --no-transfer-progress
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        continue-on-error: false
