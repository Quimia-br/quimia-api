name: Título do PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validar-titulo:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[a-záàãâéêíóôõúüç].+[^.]$
          subjectPatternError: |
            A descrição deve começar com letra minúscula e não terminar com ponto final.
